[[faq]]
q = "How do I install the Yandex Metrica MCP server?"
a = "Use Docker: docker run -i --rm -e YANDEX_METRICA_TOKEN ghcr.io/stufently/yandex-metrica-mcp:latest. Nothing to clone and no Node.js needed. The npm package @stufently/yandex-metrica-mcp is not published yet."

[[faq]]
q = "Which token do I need?"
a = "A Yandex OAuth token with the metrika:read scope in YANDEX_METRICA_TOKEN. Creating and deleting counters requires the metrika:write scope."

[[faq]]
q = "Which AI clients does it work with?"
a = "Any MCP client over stdio. The README has configs for Claude Code, Claude Desktop, Cursor, Windsurf, Codex CLI and Zed; Claude Code on Ubuntu is verified in daily use, the others are documented only."

[[faq]]
q = "Is the server read-only?"
a = "No. Eight of the 13 tools only read. Five change your Metrica account: create and delete a counter, and create, cancel and clean a Logs API export."

[[faq]]
q = "How does the Logs API export work?"
a = "It is asynchronous: evaluate, create a request, poll yandex_metrica_get_logs_request until status is processed, download each part, then clean. Parts return a 50KB preview unless you set mode to full."

[[faq]]
q = "Does it cache responses?"
a = "No. Every tool call hits the Yandex API. Retries with exponential backoff are built in: 3 retries on statuses 429, 500, 502, 503 and 504."
