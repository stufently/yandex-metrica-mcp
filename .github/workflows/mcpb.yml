name: MCPB release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  mcpb:
    name: Build and upload .mcpb
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check tag matches package.json version
        run: |
          ver="$(jq -r .version package.json)"
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $ver"
            exit 1
          fi

      - name: Build Desktop extension
        run: bash scripts/build-mcpb.sh

      - name: Compute SHA256 checksums for the bundles
        run: bash scripts/mcpb-checksums.sh dist-mcpb dist-mcpb/checksums.txt

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes "Release $GITHUB_REF_NAME"
          fi

      - name: Upload .mcpb asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist-mcpb/*.mcpb --clobber

      - name: Upload bundle checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist-mcpb/checksums.txt --clobber
