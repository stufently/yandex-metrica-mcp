name: Docker

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Third-party actions are pinned by commit SHA — `vN` tags are mutable and
      # this job holds a GHCR push token. Each SHA pins the full release tag below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Glama and the MCP registry start the image with no token and no network
      # and list its tools; the image must survive exactly that.
      - name: Build image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: yandex-metrica-mcp:smoke
          cache-from: type=gha

      - name: Smoke test (no token, no network)
        run: |
          name="ymm-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 5
          } | timeout 60 docker run -i --name "$name" --network none -u 1002:1002 \
              yandex-metrica-mcp:smoke > smoke.out
          cat smoke.out
          jq -e 'select(.id == 1) | .result.serverInfo.name == "yandex-metrica-mcp"' smoke.out
          count="$(jq -r 'select(.id == 2) | .result.tools | length' smoke.out)"
          echo "tools: $count"
          [ "$count" = 13 ]

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishes server.json to the official MCP registry
  # (registry.modelcontextprotocol.io) — the index MCP clients and directories
  # read. Runs only for a version tag, after the image for that tag is pushed:
  # the registry checks that the OCI image exists and carries the
  # io.modelcontextprotocol.server.name label (set in the Dockerfile).
  # Auth is the workflow's short-lived GitHub OIDC token — no stored secret.
  mcp-registry:
    name: Publish to MCP Registry
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISHER_VERSION: "1.8.1"
      PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
      NPM_PACKAGE: "@stufently/yandex-metrica-mcp"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stamp version into server.json
        run: |
          ver="${GITHUB_REF_NAME#v}"
          pkg_ver="$(jq -r .version package.json)"
          if [ "$ver" != "$pkg_ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg_ver"
            exit 1
          fi
          jq --arg v "$ver" '
            .version = $v
            | .packages |= map(
                if .registryType == "oci"
                then .identifier = "ghcr.io/stufently/yandex-metrica-mcp:" + $v
                else .version = $v end)
          ' server.json > server.stamped.json
          # The npm release is cut by hand (`npm publish`), so it may lag the tag.
          # The registry rejects an entry whose npm package is missing or lacks
          # `mcpName`; publish the OCI package alone rather than fail the release.
          name="$(jq -r .name server.json)"
          url="https://registry.npmjs.org/${NPM_PACKAGE/\//%2f}/$ver"
          if curl -fsS -o npm.json "$url" && [ "$(jq -r '.mcpName // empty' npm.json)" = "$name" ]; then
            echo "npm $NPM_PACKAGE@$ver found with mcpName, publishing both packages"
          else
            echo "::warning::npm $NPM_PACKAGE@$ver not published (or no mcpName) — publishing OCI package only"
            jq '.packages |= map(select(.registryType != "npm"))' server.stamped.json > server.tmp.json
            mv server.tmp.json server.stamped.json
          fi
          mv server.stamped.json server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          url="https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o publisher.tar.gz "$url"
          echo "${PUBLISHER_SHA256}  publisher.tar.gz" | sha256sum -c -
          tar -xzf publisher.tar.gz mcp-publisher

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
