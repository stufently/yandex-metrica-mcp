services:
  yandex-metrica-mcp:
    build: .
    image: yandex-metrica-mcp:local
    container_name: yandex-metrica-mcp
    environment:
      YANDEX_METRICA_TOKEN: ${YANDEX_METRICA_TOKEN}
      YANDEX_METRICA_TIMEOUT_MS: ${YANDEX_METRICA_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      YANDEX_METRICA_USER_AGENT: ${YANDEX_METRICA_USER_AGENT:-yandex-metrica-mcp/0.2.3}
    stdin_open: true
    tty: false
    restart: "no"
